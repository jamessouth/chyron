name: Checkout repo and setup OCaml
description: Combine checkout and setup
inputs:
  ocaml-compiler:  
    description: OCaml compiler version
    required: true
runs:
  using: composite
  steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set-up OCaml
      uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}
