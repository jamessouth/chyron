name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  lint-fmt:
    name: Lint format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and setup OCaml
        uses: $/.github/actions/checkout_setupocaml
        with: &compiler
          ocaml-compiler: 5
      - name: Lint format
        uses: ocaml/setup-ocaml/lint-fmt@ff66428f72b64472e749b22e0ad4dded4b2ddca6

  lint-opam:
    name: Lint opam
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and setup OCaml
        uses: $/.github/actions/checkout_setupocaml
        with: *compiler
      - name: Lint opam
        uses: ocaml/setup-ocaml/lint-opam@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        
  analysis:
    name: Analyze deps
    runs-on: ubuntu-latest
    concurrency:
      group: opam-dependency-submission
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout repo and setup OCaml
        uses: $/.github/actions/checkout_setupocaml
        with: *compiler
      - name: Analyze deps
        uses: ocaml/setup-ocaml/analysis@ff66428f72b64472e749b22e0ad4dded4b2ddca6

  build:
    name: Build OCaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo and setup OCaml
        uses: $/.github/actions/checkout_setupocaml
        with: *compiler
      - name: Install deps
        run: opam install . --deps-only --with-test
      - name: Store build timestamp
        run: echo "BUILT_AT=$(TZ='UTC' date -Iminutes)" >> $GITHUB_ENV
      - name: Build program
        run: opam exec -- dune build --release
        env: 
          CHYRON_VERSION: ${{ github.ref_name }}
          CHYRON_BUILD_INFO: ${{ github.sha }}_${{ github.event_name }}_${{ github.run_id }}_${{ github.run_number }}_${{ env.BUILT_AT }}


      - run: ./_build/default/chyron/bin/main.exe version
      # - run: opam exec -- dune runtest




