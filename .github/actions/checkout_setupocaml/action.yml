name: Checkout repo and setup OCaml
description: Combine checkout and setup
inputs:
  ocaml-compiler:  
    description: OCaml compiler version
    required: true
runs:
  using: composite
  steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set-up OCaml
      uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}




jobs:
  job1:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      output1: ${{ steps.step1.outputs.test }}
      output2: ${{ steps.step2.outputs.test }}
    steps:
      - id: step1
        run: echo "test=hello" >> "$GITHUB_OUTPUT"
      - id: step2
        run: echo "test=world" >> "$GITHUB_OUTPUT"
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - env:
          OUTPUT1: ${{needs.job1.outputs.output1}}
          OUTPUT2: ${{needs.job1.outputs.output2}}
        run: echo "$OUTPUT1 $OUTPUT2"



