  build_release_publish:
    name: Build OCaml, release on GitHub, publish to AUR
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo and setup OCaml
        uses: $/.github/actions/checkout_setupocaml
        with:
          ocaml-compiler: 5
      - name: Install deps
        run: opam install . --deps-only --with-test
      - name: Store build timestamp
        run: echo "BUILT_AT=$(TZ='UTC' date -Iminutes)" >> "$GITHUB_ENV"
      - name: Build program
        env: 
          CHYRON_VERSION: ${{ github.ref_name }}
          CHYRON_BUILD_INFO: ${{ github.sha }}_${{ github.event_name }}_${{ github.run_id }}_${{ github.run_number }}_${{ env.BUILT_AT }}
        run: |
          opam exec -- dune build --release
          mkdir -p dist
          mv ./_build/default/chyron/bin/main.exe dist/chyron
          cp ./LICENSE ./body.md ./PKGBUILD dist/
          echo "PKGVER=${CHYRON_VERSION#v}" >> "$GITHUB_ENV"
      - name: Calculate binary sum
        run: echo "BINARY_SUM=$(b2sum dist/chyron | awk '{printf "%s", $1}')" >> "$GITHUB_ENV"
      - name: Calculate license sum
        run: echo "LICENSE_SUM=$(b2sum dist/LICENSE | awk '{printf "%s", $1}')" >> "$GITHUB_ENV"
      - name: Update dist/PKGBUILD with version
        run: sed -i "/^pkgver/c\pkgver=$PKGVER" dist/PKGBUILD 
      - name: Update dist/body.md with b2sums
        run: sed -i "s/xxxx/$BINARY_SUM/; s/yyyy/$LICENSE_SUM/" dist/body.md
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          artifacts: "dist/chyron,dist/LICENSE"
          bodyFile: "dist/body.md"
          immutableCreate: true
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: chyron-bin
          pkgbuild: dist/PKGBUILD
          updpkgsums: 'true'
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.PKGVER }}
